task printEntityRenderStateClass {
    doLast {
        def urlUrls = sourceSets.main.compileClasspath.collect { it.toURI().toURL() } as java.net.URL[]
        def cl = new java.net.URLClassLoader(urlUrls, this.class.classLoader)
        def clazz = cl.loadClass('net.minecraft.client.renderer.entity.state.EntityRenderState')
