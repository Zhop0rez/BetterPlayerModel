plugins {
	id 'fabric-loom' version '1.17.12'
	id 'maven-publish'
}

version = project.mod_version
group = 'rip.ysm'

base {
	archivesName = project.archives_name
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.quiltmc.org/repository/release" }
	maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://jitpack.io" }
    maven { url "https://maven.ladysnake.org/releases" }
    maven { url "https://www.cursemaven.com" }
    maven { url "https://libraries.minecraft.net/" }
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

def ccaVersion = "8.0.0"

dependencies {
    mappings "net.fabricmc:intermediary:0.0.0:v2"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${ccaVersion}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-block:${ccaVersion}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-chunk:${ccaVersion}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${ccaVersion}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-item:${ccaVersion}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-level:${ccaVersion}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:${ccaVersion}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-world:${ccaVersion}"
    modImplementation "maven.modrinth:forge-config-api-port:jUe0ucoE"
    include "maven.modrinth:forge-config-api-port:jUe0ucoE"
    implementation "com.electronwill.night-config:core:3.8.3"
    include "com.electronwill.night-config:core:3.8.3"
    implementation "com.electronwill.night-config:toml:3.8.3"
    include "com.electronwill.night-config:toml:3.8.3"
    compileOnly "com.terraformersmc:modmenu:15.0.0"
    
    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    implementation "com.github.luben:zstd-jni:1.5.7-8"
    include "com.github.luben:zstd-jni:1.5.7-8"

    implementation 'net.java.dev.jna:jna:5.14.0'
    include 'net.java.dev.jna:jna:5.14.0'
    
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
    it.options.encoding = "UTF-8"
    it.exclude("net/minecraft/**")
    it.exclude("net/fabricmc/**")
    it.exclude("com/mojang/**")
}

java {
	// withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.matching { it.name == 'sourcesJar' || it.name == 'remapSourcesJar' }.configureEach {
    enabled = false
}


tasks.withType(Jar).configureEach {
    exclude("net/minecraft/**")
    exclude("net/fabricmc/**")
    exclude("com/mojang/**")
    
    exclude("net/irisshaders/**")
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "better_player_model.refmap.json"
    }
}

tasks.register('runTestParser', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.elfmcys.yesstevemodel.client.TestParser'
}
















task printScreenMethods {
    doLast {
        def urlUrls = sourceSets.main.compileClasspath.collect { it.toURI().toURL() } as java.net.URL[]
        def cl = new java.net.URLClassLoader(urlUrls, this.class.classLoader)
        def clazz = cl.loadClass('net.minecraft.client.gui.screens.Screen')
        clazz.getDeclaredMethods().each { println it.name + ' - ' + it.returnType.name }
    }
}
task printExtractRenderState {
    doLast {
        def urlUrls = sourceSets.main.compileClasspath.collect { it.toURI().toURL() } as java.net.URL[]
        def cl = new java.net.URLClassLoader(urlUrls, this.class.classLoader)
        def clazz = cl.loadClass('net.minecraft.client.gui.screens.Screen')
        clazz.getDeclaredMethods().findAll { it.name == 'extractRenderState' }.each { 
            println it.name + '(' + it.parameterTypes.collect { it.name }.join(', ') + ')'
        }
    }
}
task printMinecraftMethods {
    doLast {
        def urlUrls = sourceSets.main.compileClasspath.collect { it.toURI().toURL() } as java.net.URL[]
        def cl = new java.net.URLClassLoader(urlUrls, this.class.classLoader)
        def clazz = cl.loadClass('net.minecraft.client.Minecraft')
        clazz.getDeclaredMethods().findAll { it.name.startsWith('setScreen') }.each { 
            println it.name + '(' + it.parameterTypes.collect { it.name }.join(', ') + ')'
        }
    }
}
task printGuiGraphicsClass {
    doLast {
        def urlUrls = sourceSets.main.compileClasspath.collect { it.toURI().toURL() } as java.net.URL[]
        def cl = new java.net.URLClassLoader(urlUrls, this.class.classLoader)
        try {
            def clazz = cl.loadClass('net.minecraft.client.gui.GuiGraphicsExtractor')
            println "GuiGraphicsExtractor EXISTS"
        } catch (Exception e) {
            println "GuiGraphicsExtractor NOT FOUND"
        }
        try {
            def clazz2 = cl.loadClass('net.minecraft.client.gui.GuiGraphics')
            println "GuiGraphics EXISTS"
        } catch (Exception e) {
            println "GuiGraphics NOT FOUND"
        }
    }
}
